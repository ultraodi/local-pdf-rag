services:
  app:
    build: .
    ports:
      - "${APP_PORT:-7860}:7860"
    environment:
      # Default: use Ollama running natively on your machine.
      # To use the bundled container instead, set OLLAMA_BASE_URL=http://ollama:11434
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma_data:/data/chroma
    extra_hosts:
      # Makes host.docker.internal work on Linux too (already works on Mac/Windows)
      - "host.docker.internal:host-gateway"

  # Optional: only starts when you pass --profile ollama
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  chroma_data:
  ollama_data: